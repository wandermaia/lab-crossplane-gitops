# crossplane/direct/dynamodb-table.yaml
apiVersion: dynamodb.aws.m.upbound.io/v1beta1
kind: Table
metadata:
  name: lab-crossplane-tabela-direto
  namespace: default
spec:
  forProvider:
    region: us-east-1
    hashKey: id
    attribute:
      - name: id
        type: S
    billingMode: PAY_PER_REQUEST
  providerConfigRef:
    name: default
    kind: ClusterProviderConfig
